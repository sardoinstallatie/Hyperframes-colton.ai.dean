  Sardo-format (zie ../../SARDO_FORMAT.md). Gebaseerd op D12 (goedgekeurd Funda Fixer-format).
  Alleen het CONFIG-blok onderaan aanpassen.

<html lang="nl" data-resolution="portrait">

    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--brand-bg); }

      /* ZONE 1 — Peter. Wrapper full-frame; FACE_OFFSET zet de ogen op y≈534. */

      #hook { font-size: 92px; }
      #hook .hl, #cta .big { color: var(--brand-accent); }
      #cta .small { display: block; font-size: 54px; font-weight: 700; margin-bottom: 6px; }

      .beeld .of { font-size: 60px; color: var(--brand-text-dim); }

      .beeld .lab { width: 150px; height: 150px; border-radius: 22px; display: flex; align-items: center; justify-content: center;

        border-top: 2px dashed var(--brand-border); font-size: 40px; font-weight: 800; }
      .bon .tot .p { color: var(--brand-accent); font-size: 52px; }
    </style>
  </head>
  <body>

    </div>

    <script>
      const WORDS = [["Dit", 0, 0.32], ["monumentale", 0.4, 1.04], ["pand", 1.04, 1.36], ["in", 1.36, 1.52], ["Druten", 1.52, 1.84], ["gaan", 2.08, 2.24], ["we", 2.24, 2.32], ["verduurzamen", 2.32, 2.8], ["van", 2.88, 3.04], ["label", 3.04, 3.36], ["G", 3.44, 3.76], ["naar", 3.76, 4], ["label", 4, 4.32], ["A", 4.48, 4.8], ["in", 4.8, 5.04], ["1", 5.04, 5.28], ["minuut.", 5.28, 6], ["Het", 6.08, 6.24], ["is", 6.24, 6.4], ["een", 6.4, 6.56], ["2-onder-1-kapwoning,", 6.56, 7.84], ["gebouwd", 7.84, 8.24], ["in", 8.24, 8.4], ["1787.", 8.4, 9.36], ["Het", 9.6, 9.76], ["is", 9.76, 9.92], ["label", 9.92, 10.4], ["G.", 10.4, 11.2], ["We", 11.44, 11.6], ["gaan", 11.6, 11.84], ["de", 11.84, 12], ["woning", 12, 12.4], ["eerst", 12.4, 12.64], ["even", 12.64, 12.88], ["door", 13.04, 13.2], ["onze", 13.2, 13.36], ["calculator", 13.36, 13.92], ["heen", 13.92, 14.16], ["gooien.", 14.16, 14.56], ["Het", 14.88, 14.96], ["eerste", 14.96, 15.28], ["wat", 15.28, 15.36], ["wij", 15.36, 15.52], ["zouden", 15.52, 15.84], ["doen,", 15.84, 16.16], ["dat", 16.16, 16.24], ["is", 16.24, 16.32], ["het", 16.48, 16.56], ["afdichten", 16.56, 17.12], ["van", 17.12, 17.36], ["kieren.", 17.36, 17.92], ["Gaan", 18.32, 18.48], ["we", 18.48, 18.64], ["vanuit", 18.8, 19.12], ["de", 19.12, 19.2], ["binnenkant", 19.2, 19.68], ["isoleren", 19.68, 20.24], ["door", 20.24, 20.4], ["middel", 20.4, 20.56], ["van", 20.56, 20.72], ["voorzetwanden.", 20.72, 22.08], ["Dan", 22.08, 22.32], ["gaan", 22.32, 22.48], ["we", 22.48, 22.64], ["het", 22.64, 22.8], ["dak", 22.8, 23.04], ["sowieso", 23.2, 23.68], ["van", 23.68, 23.84], ["binnenuit", 23.84, 24.32], ["isoleren.", 24.32, 25.36], ["En", 25.36, 25.52], ["zouden", 25.68, 25.92], ["we", 25.92, 26], ["ook", 26, 26.16], ["de", 26.16, 26.24], ["vloer", 26.24, 26.56], ["van", 26.56, 26.72], ["binnenuit", 26.72, 27.2], ["moeten", 27.2, 27.36], ["gaan", 27.36, 27.6], ["isoleren.", 27.6, 28.16], ["Dus", 28.16, 28.32], ["je", 28.32, 28.48], ["moet", 28.48, 28.72], ["gaan", 28.72, 28.96], ["naar", 28.96, 29.2], ["voorzetramen", 29.2, 30.4], ["of", 30.4, 30.72], ["monumentenglas.", 30.88, 32.64], ["Dan", 32.64, 32.8], ["gaan", 32.8, 32.96], ["we", 32.96, 33.04], ["een", 33.04, 33.12], ["hybride", 33.2, 33.68], ["warmtepomp", 33.68, 34.32], ["installeren.", 34.32, 35.04], ["Zonnepanelen", 35.04, 35.84], ["gaan", 35.84, 35.92], ["we", 35.92, 36], ["gewoon", 36.16, 36.4], ["in", 36.4, 36.48], ["de", 36.48, 36.56], ["tuin", 36.64, 36.96], ["plaatsen.", 36.96, 37.52], ["De", 37.52, 37.68], ["totale", 37.68, 38.08], ["investering", 38.08, 38.64], ["hiervan", 38.64, 38.88], ["is", 38.88, 39.04], ["€60.000", 39.04, 40.4], ["Maar", 40.48, 40.64], ["dan", 40.64, 40.8], ["zou", 40.8, 41.04], ["je", 41.04, 41.12], ["ook", 41.12, 41.2], ["nog", 41.2, 41.36], ["eens", 41.36, 41.52], ["een", 41.52, 41.6], ["€10.000", 41.68, 42.56], ["ongeveer", 42.56, 43.28], ["aan", 43.28, 43.6], ["ISDE", 43.84, 44.16], ["subsidie", 44.56, 45.12], ["krijgen.", 45.12, 45.84], ["De", 45.84, 46], ["maandelijkse", 46, 46.48], ["kosten", 46.56, 46.8], ["zijn", 46.88, 47.12], ["teruggebracht", 47.12, 47.68], ["van", 47.68, 47.84], ["€425", 47.84, 49.12], ["per", 49.12, 49.2], ["maand", 49.2, 49.52], ["naar", 49.52, 49.68], ["€175", 49.68, 50.88], ["per", 50.88, 51.04], ["maand.", 51.04, 51.68], ["De", 51.68, 51.84], ["Fixscore", 51.84, 52.88], ["is", 52.88, 53.04], ["in", 53.04, 53.12], ["mijn", 53.12, 53.36], ["ogen", 53.36, 53.92], ["2", 53.92, 54.32], ["van", 54.32, 54.48], ["de", 54.48, 54.64], ["10.", 54.64, 55.44], ["Heb", 55.6, 55.84], ["jij", 55.84, 56.16], ["nou", 56.16, 56.24], ["ook", 56.24, 56.4], ["net", 56.4, 56.56], ["een", 56.56, 56.64], ["huis", 56.64, 56.88], ["gekocht", 56.88, 57.12], ["of", 57.2, 57.36], ["reageer", 57.36, 57.92], ["gewoon", 57.92, 58.08], ["CHECK", 58.08, 58.4], ["onder", 58.4, 58.56], ["dit", 58.56, 58.72], ["bericht.", 58.72, 59.28]];
      /* ======================= CONFIG — alleen dit aanpassen ======================= */
      const CONFIG = {
        duration: 58.88,
        faceOffsetY: -316, faceOffsetX: -110, faceScale: 1.08,  // ogen op y≈534 (bron: ogen op ~850, gezicht x≈670)
        hook: { text: 'Label <span class="hl">G</span> naar <span class="hl">A</span><br>in 1 minuut', end: 5.95 },
        cta:  { word: "CHECK", start: 57.0 },
        words: WORDS,
        chunkSize: 3,
        beelden: [
          // 1+2 Hook + het huis: Funda-foto, prijs + serie-badge direct in beeld
          { start: 0.0, end: 11.50, html: '<img src="assets/huis.png"><div class="pill">Funda Fixer #8</div><div class="tagbar"><span class="price">€ 450.000</span><span class="meta">2-onder-1-kap · Druten · 1787 · 114 m²</span></div>', pop: [] },
          // 3 Calculator (video-in-video, element bestaat al: #calc-card)
          { start: 11.44, end: 14.70, el: "#calc-card", pop: [] },
          // 4 Het plan — bonnetje, regels verschijnen als Peter ze noemt; totaal bij "60.000"
          { start: 14.60, end: 40.40, cls: "bon", html:
              '<div class="label">Het plan</div>' +
              '<div class="row r1"><span class="n">1. Kieren dicht</span><span class="p">€1k – 2,5k</span></div>' +
              '<div class="row r2"><span class="n">2. Voorzetwanden (geen spouw)</span><span class="p">€10k – 18k</span></div>' +
              '<div class="row r3"><span class="n">3. Dak van binnen</span><span class="p">€6k – 12k</span></div>' +
              '<div class="row r4"><span class="n">4. Vloer van binnen</span><span class="p">€2k – 4k</span></div>' +
              '<div class="row r5"><span class="n">5. Monumentenglas</span><span class="p">€8k – 15k</span></div>' +
              '<div class="row r6"><span class="n">6. Hybride warmtepomp</span><span class="p">€8,5k – 12k</span></div>' +
              '<div class="row r7"><span class="n">7. Zonnepanelen in de tuin</span><span class="p">€5k – 7k</span></div>' +
              '<div class="tot t1"><span>Totaal <span class="note">(€40k – 70k)</span></span><span class="p">± €60.000</span></div>',
            pop: [[".r1",16.56],[".r2",19.2],[".r3",22.8],[".r4",26.24],[".r5",29.2],[".r6",33.2],[".r7",35.04],[".t1",39.04]] },
          // 5 Subsidie + netto (+ labelsprong)
          { start: 40.44, end: 45.80, html: '<div class="label">Kosten</div><div class="labels"><div class="lab g">G</div><div class="arr">➜</div><div class="lab a">A</div></div><div class="value">± €60.000</div><div class="sub s1">− ± €10.000 ISDE-subsidie</div><div class="net s2">Netto: <b>± €50.000</b></div><div class="note s1">Schatting. Check subsidie op rvo.nl</div>', pop: [[".s1",41.68],[".s2",44.6]] },
          // 6 Energie per maand
          { start: 45.84, end: 51.60, html: '<div class="label">Energie per maand</div><div class="line">Nu: <b class="dim">± €425</b></div><div class="line m2">Straks: <b class="acc">± €175</b></div>', pop: [[".m2",49.68]] },
          // 7 Fixscore
          { start: 51.68, end: 55.50, html: '<div class="label">Fixscore <span style="text-transform:none;letter-spacing:0">· hoger = makkelijker</span></div><div class="value">2<span class="of">/10</span></div><div class="line f1">✗ Monument</div><div class="line f1">✗ Geen spouw</div>', pop: [[".f1",53.92]] },
        ],
        punchIns: [ [6.08, 1.16], [11.44, 1.0], [14.60, 1.16], [18.32, 1.0], [22.08, 1.12], [25.36, 1.0], [28.16, 1.12], [32.64, 1.0], [35.04, 1.12], [37.52, 1.0], [40.44, 1.16], [45.84, 1.0], [51.68, 1.16], [55.6, 1.0], [57.0, 1.12] ],
      };
      /* ============================================================================ */

      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // Face-positie
      gsap.set("#face-wrapper", { x: CONFIG.faceOffsetX, y: CONFIG.faceOffsetY, scale: CONFIG.faceScale });
      CONFIG.punchIns.forEach(([t, s]) => tl.set("#face-wrapper", { scale: CONFIG.faceScale * s }, t));

      // Hook op ankerpunt
      $("#hook").innerHTML = CONFIG.hook.text;
      tl.fromTo("#hook", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 0.02);
      tl.to("#hook", { opacity: 0, duration: 0.12, ease: "power2.in" }, CONFIG.hook.end);

      // Captions (na de hook-tekst, tot de CTA)
      const cap = $("#captions");
      const words = CONFIG.words.filter(([, s]) => s >= CONFIG.hook.end - 0.05 && s < CONFIG.cta.start - 0.05);
      const chunks = []; let cur = [];
      words.forEach((wd) => {
        const len = cur.map(([t]) => t).join(" ").length + (cur.length ? 1 : 0) + wd[0].length;
        if (cur.length && (cur.length >= CONFIG.chunkSize || len > 18 || /[.?!]$/.test(cur[cur.length-1][0]))) { chunks.push(cur); cur = []; }
        cur.push(wd);
      });
      if (cur.length) chunks.push(cur);
      chunks.forEach((group, i) => {
        const el = document.createElement("div");
        el.className = "chunk";
        el.innerHTML = group.map(([w]) => `<span class="w">${w}</span>`).join("");
        cap.appendChild(el);
        const start = group[0][1];
        const end = chunks[i + 1] ? chunks[i + 1][0][1] : Math.min(group[group.length - 1][2] + 0.3, CONFIG.cta.start);
        tl.set(el, { opacity: 1 }, start);
        tl.set(el, { opacity: 0 }, Math.min(end, CONFIG.cta.start));
        group.forEach(([, s, e], j) => {
          const span = el.children[j];
          tl.set(span, { className: "w on" }, s);
          tl.set(span, { className: "w" }, e);
        });
      });

      // Beeld-zone
      const layer = $("#beeld-layer");
      CONFIG.beelden.forEach((b, i) => {
        let el;
        if (b.el) el = $(b.el);
        else {
          el = document.createElement("div");
          el.className = "beeld" + (b.cls ? " " + b.cls : "");
          el.innerHTML = b.html;
          layer.appendChild(el);
        }
        (b.pop||[]).forEach(([sel,t]) => el.querySelectorAll(sel).forEach((n) => tl.fromTo(n, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, t)));
        tl.set("#beeld-bg", { opacity: 1 }, b.start);
        tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, b.start);
        tl.to(el, { opacity: 0, duration: 0.15, ease: "power2.in" }, b.end - 0.15);
        const next = CONFIG.beelden[i + 1];
        if (!next || next.start > b.end + 0.05) tl.set("#beeld-bg", { opacity: 0 }, b.end);
      });

      // CTA
      $("#cta").innerHTML = `<span class="small">Reageer</span><span class="big">${CONFIG.cta.word}</span>`;
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, CONFIG.cta.start);

      tl.set({}, {}, CONFIG.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
