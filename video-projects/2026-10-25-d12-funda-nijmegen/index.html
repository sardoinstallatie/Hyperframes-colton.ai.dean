<!--
  SARDO-FORMAT TEMPLATE (zie ../../SARDO_FORMAT.md)
  Kopieer deze map per hook-versie:  cp -r templates/sardo-format video-projects/<slug>/<A|B|C>
  Pas daarna alleen het CONFIG-blok onderaan aan (duur, bron, hook, woorden, beelden, CTA).
  Lagen:  face (zone 1, ogen op y≈534) · hook/CTA op ankerpunt y=960 · captions zone 2 · beeld-zone 3
-->
<html lang="nl" data-resolution="portrait">

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--brand-bg); }
      body { font-family: var(--font-display); color: var(--brand-text); }

      /* ZONE 1 — Peter. Wrapper is altijd full-frame; FACE_OFFSET_Y zet de ogen op y≈534. */
      #face-wrapper { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 534px; }
      #face { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ANKERPUNT y=960 — hook-tekst en CTA */
      .anchor-text { position: absolute; left: 60px; right: 60px; top: 960px; transform: translateY(-50%);
        text-align: center; font-weight: 800; line-height: 1.05; letter-spacing: -0.01em;
        -webkit-text-stroke: 3px var(--caption-stroke); paint-order: stroke fill;
        text-shadow: 0 6px 24px rgba(0,0,0,0.55); opacity: 0; }
      #hook { font-size: 92px; }
      #hook .hl, #cta .big { color: var(--brand-accent); }
      #cta .small { display: block; font-size: 54px; font-weight: 700; margin-bottom: 6px; }
      #cta .big { display: block; font-size: 160px; }

      /* ZONE 2 — captions 970–1190 */
      #captions { position: absolute; left: 40px; right: 40px; top: 970px; height: 220px;
        display: flex; align-items: center; justify-content: center; }
      .chunk { position: absolute; width: 100%; text-align: center; font-size: 78px; white-space: nowrap; font-weight: 800;
        line-height: 1.1; -webkit-text-stroke: 3px var(--caption-stroke); paint-order: stroke fill;
        text-shadow: 0 4px 18px rgba(0,0,0,0.6); opacity: 0; }
      .w { display: inline-block; margin: 0 0.14em; }
      .w.on { color: var(--brand-accent); }

      /* ZONE 3 — beeld 1205–1905, x 0–918 */
      #beeld-bg { position: absolute; left: 0; top: 1190px; width: 1080px; height: 730px;
        background: var(--brand-bg); opacity: 0; }
      .beeld { position: absolute; left: 36px; top: 1225px; width: 846px; height: 560px; border-radius: 24px;
        background: var(--brand-surface); border: 2px solid var(--brand-border); padding: 40px;
        display: flex; flex-direction: column; justify-content: center; gap: 18px; opacity: 0; overflow: hidden; }
      .beeld img, .beeld video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .beeld .label { font-size: 34px; font-weight: 600; color: var(--brand-text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
      .beeld .value { font-size: 96px; font-weight: 800; color: var(--brand-accent); line-height: 1; }
      .beeld .line { font-size: 60px; font-weight: 700; line-height: 1.15; }
      .beeld .arrow { color: var(--brand-warn); }
      .beeld .tagbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 32px; background: rgba(25,25,30,0.88);
        font-size: 40px; font-weight: 700; }
      .beeld .step { font-size: 50px; font-weight: 700; line-height: 1.1; }
      .beeld .labels { display: flex; align-items: center; gap: 48px; }
      .beeld .lab { width: 190px; height: 190px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
        font-size: 150px; font-weight: 800; color: var(--brand-bg); }
      .beeld .lab.e { background: var(--brand-accent); }
      .beeld .lab.a { background: var(--brand-warn); }
      .beeld .arr { font-size: 110px; font-weight: 800; color: var(--brand-text); }
      .beeld .value.big { font-size: 140px; }
      .beeld .of { font-size: 60px; color: var(--brand-text-dim); }
      .beeld .note { font-size: 28px; font-weight: 600; color: var(--brand-text-dim); }
      .beeld .dim { color: var(--brand-text-dim); } .beeld .acc { color: var(--brand-accent); }
    </style>
  </head>

        ],
        chunkSize: 3,
        beelden: [
          { start: 3.9, end: 10.9, type: "html", html: '<img src="assets/huis.jpg"><div class="tagbar">Hoekwoning · Nijmegen · 1948</div>' , pop: [] },
          { start: 10.95, end: 19.55, type: "html", html: '<div class="label">Het plan</div><div class="step s1">1. Spouwmuur isoleren</div><div class="step s2">2. Vloer isoleren</div><div class="step s3">3. Dak isoleren</div><div class="step s4">4. Hybride warmtepomp</div><div class="step s5">5. Zonnepanelen</div>', pop: [[".s1",13.2],[".s2",14.5],[".s3",15.76],[".s4",17.2],[".s5",18.48]] },

      /* ============================================================================ */

      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // Face-positie
      gsap.set("#face-wrapper", { y: CONFIG.faceOffsetY, scale: CONFIG.faceScale });
      CONFIG.punchIns.forEach(([t, s]) => tl.set("#face-wrapper", { scale: s }, t));

      // Hook op ankerpunt
      $("#hook").innerHTML = CONFIG.hook.text;
      tl.fromTo("#hook", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 0.02);
      tl.to("#hook", { opacity: 0, duration: 0.12, ease: "power2.in" }, CONFIG.hook.end);

      // Captions (start pas na de hook-tekst zodat ze niet dubbel staan)
      const cap = $("#captions");
      const words = CONFIG.words.filter(([, s]) => s >= CONFIG.hook.end - 0.05 && s < CONFIG.cta.start - 0.05);
      // Chunks: max 3 woorden én max 18 tekens, zodat het op 1 regel past
      const chunks = []; let cur = [];
      words.forEach((wd) => {
        const len = cur.map(([t]) => t).join(" ").length + (cur.length ? 1 : 0) + wd[0].length;
        if (cur.length && (cur.length >= CONFIG.chunkSize || len > 18)) { chunks.push(cur); cur = []; }
        cur.push(wd);
      });
      if (cur.length) chunks.push(cur);
      chunks.forEach((group, i) => {
        const el = document.createElement("div");
        el.className = "chunk";
        el.innerHTML = group.map(([w]) => `<span class="w">${w}</span>`).join("");
        cap.appendChild(el);
        const start = group[0][1];
        const end = chunks[i + 1] ? chunks[i + 1][0][1] : Math.min(group[group.length - 1][2] + 0.3, CONFIG.cta.start);
        tl.set(el, { opacity: 1 }, start);
        tl.set(el, { opacity: 0 }, Math.min(end, CONFIG.cta.start));
        group.forEach(([, s, e], j) => {
          const span = el.children[j];
          tl.set(span, { className: "w on" }, s);
          tl.set(span, { className: "w" }, e);
        });
      });

      // Beeld-zone
      const layer = $("#beeld-layer");
      CONFIG.beelden.forEach((b, i) => {
        const el = document.createElement("div");
        el.className = "beeld";
        if (b.type === "img") el.innerHTML = `<img src="${b.src}">`;
        else if (b.type === "html") el.innerHTML = b.html;
        else if (b.type === "video") el.innerHTML = `<video src="${b.src}" muted playsinline></video>`;
        else el.innerHTML = (b.label ? `<div class="label">${b.label}</div>` : "") + (b.value ? `<div class="value">${b.value}</div>` : "") + (b.lines || []).map((l) => `<div class="line">${l}</div>`).join("");
        layer.appendChild(el);
        (b.pop||[]).forEach(([sel,t]) => tl.fromTo(el.querySelector(sel), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, t));
        tl.set("#beeld-bg", { opacity: 1 }, b.start);
        tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, b.start);
        tl.to(el, { opacity: 0, duration: 0.15, ease: "power2.in" }, b.end - 0.15);
        const next = CONFIG.beelden[i + 1];
        if (!next || next.start > b.end + 0.05) tl.set("#beeld-bg", { opacity: 0 }, b.end);

      $("#cta").innerHTML = `<span class="small">Reageer</span><span class="big">${CONFIG.cta.word}</span>`;
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, CONFIG.cta.start);

      tl.set({}, {}, CONFIG.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
