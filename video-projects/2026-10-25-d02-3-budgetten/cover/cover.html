<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand-tokens.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#19191e;font-family:Poppins,sans-serif;position:relative}
#face{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;transform:translateY(-60px) scale(1.06);transform-origin:540px 534px}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,25,30,0) 40%,rgba(25,25,30,.75) 62%,rgba(25,25,30,.96) 80%)}
#txt{position:absolute;left:0;right:0;top:1000px;text-align:center}
.l1{font-size:120px;font-weight:800;color:#fff;line-height:1;-webkit-text-stroke:4px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.l2{font-size:150px;font-weight:800;color:#ffa62b;line-height:1.05;letter-spacing:-.01em;-webkit-text-stroke:4px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.chips{display:flex;justify-content:center;gap:22px;margin-top:44px}
.chip{background:#24242b;border:3px solid #ffa62b;color:#fff;font-size:58px;font-weight:800;padding:14px 30px;border-radius:22px}
.tag{margin-top:34px;font-size:40px;font-weight:600;color:#b8bcc6;letter-spacing:.04em}
</style></head><body>
<img id="face" src="face.jpg"><div id="shade"></div>
<div id="txt"><div class="l1">1 huis</div><div class="l2">3 budgetten</div>
<div class="chips"><div class="chip">€5k</div><div class="chip">€20k</div><div class="chip">€40k</div></div>
<div class="tag">Hoekhuis uit 1932 · Arnhem</div></div>
</body></html>
