          { start: 0.3, end: 6.15, cls: "chat", html: '<div class="badge">Funda Fixer #6</div><img src="assets/chat.png">', pop: [] },
          // 2 Het huis: foto + prijs, geen adres (wens kijker)
          { start: 6.2, end: 12.70, html: '<div class="badge">Funda Fixer #6</div><img src="assets/huis.png"><div class="tagbar"><span class="price">€ 225.000</span><span class="meta">Tussenwoning · Leeuwarden · 1933 · 89 m²<br><span class="acc">Energielabel F</span></span></div>', pop: [] },
          // 3 Calculator (video-in-video)
          { start: 12.74, end: 20.34, el: "#calc-card", pop: [] },
          // 4 Het plan — regels verschijnen als Peter ze noemt, prijzen pas bij "€36.500"
          { start: 20.4, end: 98.7, cls: "bon", html:
              '<div class="label">Het plan</div>' +
              '<div class="row r1"><span class="n">Spouwmuur isoleren</span><span class="p">€2.000</span></div>' +
              '<div class="row r2"><span class="n">Dak isoleren</span><span class="p">€5.000</span></div>' +
              '<div class="row r3"><span class="n">Vloer isoleren</span><span class="p">€1.500</span></div>' +
              '<div class="row r4"><span class="n">HR++ glas</span><span class="p">€5.500</span></div>' +
              '<div class="row r5"><span class="n">Ventilatie</span><span class="p">€3.000</span></div>' +
              '<div class="row r6"><span class="n">Hybride warmtepomp</span><span class="p">€10.500</span></div>' +
              '<div class="row r7"><span class="n">6–8 zonnepanelen</span><span class="p">€3.500</span></div>' +
              '<div class="row r8"><span class="n">Batterij 5–10 kWh</span><span class="p">€5.500</span></div>' +
              '<div class="tot"><span>Totaal</span><span class="p">± €36.500</span></div>',
            pop: [[".r1",29.04],[".r2",39.36],[".r3",43.68],[".r4",54.56],[".r5",64.51],[".r6",80.67],[".r7",89.47],[".r8",92.83],[".row .p",96.27],[".tot",96.6]] },
          // 5 Subsidie + netto
          { start: 98.8, end: 103.2, html: '<div class="label">Kosten</div><div class="value">± €36.500</div><div class="sub s1">− €3.000 à €5.000 subsidie</div><div class="net s2">Netto: <b>± €31.500 – €33.500</b></div><div class="note s1">Schatting. Check subsidie op rvo.nl</div>', pop: [[".s1",99.95],[".s2",102.1]] },
          // 6 Energie per maand
          { start: 103.4, end: 113.0, html: '<div class="label">Energie per maand</div><div class="line">Nu: <b class="dim">± €250</b></div><div class="line m2">Straks: <b class="acc">± €90</b></div><div class="line m3">Je bespaart <b class="acc">€160</b> per maand</div>', pop: [[".m2",108.67],[".m3",111.71]] },
          // 7 Fixscore
          { start: 113.2, end: 126.3, html: '<div class="label">Fixscore <span style="text-transform:none;letter-spacing:0">· hoger = makkelijker</span></div><div class="value">6<span class="of">/10</span></div><div class="line f1">✓ Renoveren? Dan alles in één keer</div><div class="line f2">✓ Opknapper: in één keer goed</div>', pop: [[".f1",115.07],[".f2",122.19]] },
        ],
        punchIns: [ [2.8, 1.12], [6.2, 1.0], [12.74, 1.14], [20.4, 1.0], [25.68, 1.12], [31.28, 1.0], [38.16, 1.12], [43.52, 1.0], [51.04, 1.14], [57.6, 1.0], [61.55, 1.12], [66.27, 1.0], [72.75, 1.12], [78.27, 1.0], [82.67, 1.12], [87.23, 1.0], [94.27, 1.14], [98.8, 1.0], [103.4, 1.14], [109.95, 1.0], [113.2, 1.14], [117.87, 1.0], [122.19, 1.12], [126.5, 1.0], [130.0, 1.1], [135.9, 1.16] ],
      };
      /* ============================================================================ */


      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // Face-positie
      gsap.set("#face-wrapper", { x: CONFIG.faceOffsetX, y: CONFIG.faceOffsetY, scale: CONFIG.faceScale });
      CONFIG.punchIns.forEach(([t, s]) => tl.set("#face-wrapper", { scale: CONFIG.faceScale * s }, t));

      // Hook op ankerpunt
      $("#hook").innerHTML = CONFIG.hook.text;
      tl.fromTo("#hook", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 0.02);
      tl.to("#hook", { opacity: 0, duration: 0.12, ease: "power2.in" }, CONFIG.hook.end);

      // Captions (na de hook-tekst, tot de CTA)
      const cap = $("#captions");
      const words = CONFIG.words.filter(([, s]) => s >= CONFIG.hook.end - 0.05 && s < CONFIG.cta.start - 0.05);
      const chunks = []; let cur = [];
      words.forEach((wd) => {
        const len = cur.map(([t]) => t).join(" ").length + (cur.length ? 1 : 0) + wd[0].length;
        const prevEnds = cur.length && /[.?!,]$/.test(cur[cur.length - 1][0]);
        if (cur.length && (cur.length >= CONFIG.chunkSize || len > 18 || prevEnds)) { chunks.push(cur); cur = []; }
        cur.push(wd);
      });
      if (cur.length) chunks.push(cur);
      chunks.forEach((group, i) => {
        const el = document.createElement("div");
        el.className = "chunk";
        el.innerHTML = group.map(([w]) => `<span class="w">${w}</span>`).join("");
        const chars = group.map(([w]) => w).join(" ").length;
        if (chars > 17) el.style.fontSize = Math.max(48, Math.floor(78 * 17 / chars)) + "px";
        cap.appendChild(el);
        const start = group[0][1];
        const end = chunks[i + 1] ? chunks[i + 1][0][1] : Math.min(group[group.length - 1][2] + 0.3, CONFIG.cta.start);
        tl.set(el, { opacity: 1 }, start);
        tl.set(el, { opacity: 0 }, Math.min(end, CONFIG.cta.start));
        group.forEach(([, s, e], j) => {
          const span = el.children[j];
          tl.set(span, { className: "w on" }, s);
          tl.set(span, { className: "w" }, e);
        });
      });

      // Beeld-zone
      const layer = $("#beeld-layer");
      CONFIG.beelden.forEach((b, i) => {
        let el;
        if (b.el) el = $(b.el);
        else {
          el = document.createElement("div");
          el.className = "beeld" + (b.cls ? " " + b.cls : "");
          el.innerHTML = b.html;
          layer.appendChild(el);
        }
        (b.pop||[]).forEach(([sel,t]) => el.querySelectorAll(sel).forEach((n) => tl.fromTo(n, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, t)));
        tl.set("#beeld-bg", { opacity: 1 }, b.start);
        tl.fromTo(el, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, b.start);
        tl.to(el, { opacity: 0, duration: 0.15, ease: "power2.in" }, b.end - 0.15);
        const next = CONFIG.beelden[i + 1];
        if (!next || next.start > b.end + 0.05) tl.set("#beeld-bg", { opacity: 0 }, b.end);
      });

      // CTA
      $("#cta").innerHTML = `<span class="small">Reageer</span><span class="big">${CONFIG.cta.word}</span>`;
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, CONFIG.cta.start);

      tl.set({}, {}, CONFIG.duration);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
