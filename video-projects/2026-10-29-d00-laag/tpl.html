<!doctype html>
<html lang="nl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--brand-bg); }
      body { font-family:var(--font-display); color:#fff; }
      #top { position:absolute; left:0; top:0; width:1080px; height:960px; background:radial-gradient(ellipse at 50% 60%, #26262e 0%, #19191e 70%); overflow:hidden; }
      #house, #pyr, #outro { position:absolute; inset:0; }
      #pyr, #outro { opacity:0; }
      .band { position:absolute; transform-origin:50% 50%; }
      .band .fill { position:absolute; inset:0; background:#e4e5ea; }
      .band .lab { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff;
        -webkit-text-stroke:4px #111; paint-order:stroke fill; opacity:0; }
      .head { position:absolute; left:0; right:0; top:120px; text-align:center; font-size:104px; font-weight:800; line-height:1;
        -webkit-text-stroke:5px #111; paint-order:stroke fill; text-shadow:0 6px 24px rgba(0,0,0,.6); opacity:0; }
      #hd10 { left:-130px; }
      #trophy { position:absolute; left:745px; top:100px; width:170px; height:128px; opacity:0; transform-origin:50% 100%; }
      #pglow { position:absolute; left:90px; top:240px; width:900px; height:700px; border-radius:50%;
        background:radial-gradient(ellipse, rgba(0,200,83,.45) 0%, rgba(0,200,83,0) 65%); opacity:0; }
      .oh { position:absolute; top:150px; width:500px; }
      #oh1 { left:20px; } #oh2 { left:560px; }
      .ohs { width:500px; height:444px; overflow:hidden; }
      .ohs svg { width:500px; height:444px; }
      .ol { text-align:center; font-size:84px; font-weight:800; -webkit-text-stroke:5px #111; paint-order:stroke fill; margin-top:10px; }
      #oarrow { position:absolute; left:492px; top:330px; font-size:90px; color:#ffa62b; font-weight:800; }
      #peter { position:absolute; left:0; top:960px; width:1080px; height:960px; overflow:hidden; background:#0d1a20; }
      #face-wrapper { position:absolute; left:0; top:-100px; width:1080px; height:1120px; transform-origin:540px 470px; }
      #face { width:1080px; height:1120px; object-fit:cover; display:block; }
      #seam { position:absolute; left:0; top:958px; width:1080px; height:4px; background:#fff; opacity:.9; }
      .anchor { position:absolute; left:40px; right:40px; top:960px; transform:translateY(-50%); text-align:center; font-weight:800; line-height:1.05;
        -webkit-text-stroke:4px rgba(0,0,0,.9); paint-order:stroke fill; text-shadow:0 6px 24px rgba(0,0,0,.6); opacity:0; }
      #hook { font-size:96px; } #hook .hl, #cta .hl2 { color:var(--brand-accent); }
      #cta { font-size:86px; white-space:nowrap; }
      #captions { position:absolute; left:40px; right:40px; top:880px; height:160px; }
      .chunk { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-size:80px; font-weight:800; line-height:1.05;
        -webkit-text-stroke:4px rgba(0,0,0,.9); paint-order:stroke fill; text-shadow:0 4px 18px rgba(0,0,0,.6); opacity:0; white-space:nowrap; }
      .w { display:inline-block; margin:0 .1em; } .w.on { color:var(--brand-accent); } .w.pct { font-size:1.3em; color:var(--brand-accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%D%%" data-width="1080" data-height="1920">
      <div id="peter"><div id="face-wrapper">
        <video id="face" src="assets/source.mp4" muted playsinline data-start="0" data-duration="%%D%%" data-track-index="0"></video>
      </div></div>
      <audio id="face-audio" src="assets/source.mp4" data-start="0" data-duration="%%D%%" data-track-index="9"></audio>%%SFX%%
      <div id="top" class="clip" data-start="0" data-duration="%%D%%" data-track-index="2">
        <div id="house">%%HOUSE%%</div>
        <div id="pyr"><div id="pglow"></div>%%BANDS%%%%HEADS%%%%TROPHY%%</div>
        %%OUTRO%%
      </div>
      <div id="seam" class="clip" data-start="0" data-duration="%%D%%" data-track-index="3"></div>
      <div id="captions" class="clip" data-start="0" data-duration="%%D%%" data-track-index="5"></div>
      <div id="hook" class="anchor clip" data-start="0" data-duration="%%D%%" data-track-index="6"></div>
      <div id="cta" class="anchor clip" data-start="0" data-duration="%%D%%" data-track-index="7"></div>
    </div>
    <script>
      const C = %%CFG%%;
      const E = C.ev, P = C.pct, H = C.houseOn, END = C.duration;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const loop = (t, from, to, start, end, d) => { const n = Math.max(0, Math.floor((end - start) / d) - 1); tl.fromTo(t, from, { ...to, duration: d, repeat: n, yoyo: true, ease: "sine.inOut", immediateRender: start === 0 }, start); };
      const cycle = (t, from, to, start, end, d) => { const n = Math.max(0, Math.floor((end - start) / d) - 1); tl.fromTo(t, from, { ...to, duration: d, repeat: n, ease: "none", immediateRender: start === 0 }, start); };
      const fadeOut = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.35, ease: "power2.in" }, t);
      const fadeIn = (sel, t, d = 0.35) => tl.to(sel, { opacity: 1, duration: d, ease: "power2.out" }, t);

      // ---------- Peter ----------
      C.punch.forEach(([t, s]) => tl.set("#face-wrapper", { scale: s }, t));

      // ---------- Hook ----------
      $("#hook").innerHTML = 'Nieuwe <span class="hl">HR-ketel?</span>';
      tl.fromTo("#hook", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 0.02);
      tl.to("#hook", { opacity: 0, duration: 0.1 }, C.hookEnd - 0.12);

      // ---------- Captions ----------
      const cap = $("#captions");
      C.groups.forEach((g, i) => {
        const el = document.createElement("div"); el.className = "chunk";
        el.innerHTML = g.map(([w]) => `<span class="w${/^\d+%/.test(w) ? " pct" : ""}">${w}</span>`).join(" ");
        cap.appendChild(el);
        const s = Math.max(g[0][1], C.hookEnd), nx = C.groups[i + 1];
        const e = Math.min(nx ? nx[0][1] : g[g.length - 1][2] + 0.3, C.ctaStart);
        tl.set(el, { opacity: 1 }, s); tl.set(el, { opacity: 0 }, e);
        g.forEach(([w, a, b], j) => { if (/^\d+%/.test(w)) return; tl.set(el.children[j], { className: "w on" }, a); tl.set(el.children[j], { className: "w" }, b); });
      });

      // ---------- Opening: piramide met rode onderste balk (zonder tekst), dan huis ----------
      tl.set("#house", { opacity: 0 }, 0); tl.set("#pyr", { opacity: 1 }, 0);
      tl.set("#b90 .fill", { backgroundColor: "#e53935" }, 0);
      loop("#b90", { scale: 1 }, { scale: 1.05 }, 0, C.hookEnd, 0.35);
      tl.set("#pyr", { opacity: 0 }, C.hookEnd); tl.set("#house", { opacity: 1 }, C.hookEnd);
      tl.fromTo("#house", { scale: 0.96 }, { scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, C.hookEnd);

      // ---------- Wissel huis <-> piramide ----------
      C.layers.forEach((l, i) => {
        const t = P[l], next = C.layers[i + 1];
        const back = next ? H[next] : C.outro;
        tl.set("#house", { opacity: 0 }, t); tl.set("#pyr", { opacity: 1 }, t);
        tl.fromTo("#pyr", { scale: 0.94 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, t);
        tl.set("#hd" + l, { opacity: 1 }, t); tl.fromTo("#hd" + l, { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);
        tl.set("#hd" + l, { opacity: 0 }, back);
        tl.set("#pyr", { opacity: 0 }, back);
        if (next) { tl.set("#house", { opacity: 1 }, back); tl.fromTo("#house", { scale: 0.96 }, { scale: 1, duration: 0.25, ease: "power2.out" }, back); }
        // laag kleuren
        const sel = "#b" + l, col = getComputedStyle($(sel)).getPropertyValue("--c").trim();
        tl.to(sel + " .fill", { backgroundColor: col, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(sel + " .lab", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t);
        tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out" }, t);
        if (i > 0) tl.to("#b" + C.layers[i - 1], { scale: 1, opacity: 0.8, duration: 0.25 }, t);
      });
      // top 10%: alles vol, gloed, beker
      tl.to(C.layers.map((l) => "#b" + l), { opacity: 1, scale: 1, duration: 0.3 }, P["10"] + 0.6);
      tl.fromTo("#pglow", { opacity: 0 }, { opacity: 1, duration: 0.4 }, P["10"]);
      tl.fromTo("#trophy", { opacity: 0, scale: 0.3, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.4)" }, P["10"] + 0.15);

      // ---------- Huis: 90% (start) ----------
      $$(".pul").forEach((g, i) => loop(g, { opacity: 0.35 }, { opacity: 1 }, 0, END, 0.45));
      $$(".cloudin").forEach((g) => loop(g, { scale: 0.94, transformOrigin: "50% 50%" }, { scale: 1.06 }, 0, E.weg, 0.6));
      $$("#h-smoke .puff").forEach((p, i) => cycle(p, { y: 0, opacity: 0.85, scale: 0.6, transformOrigin: "50% 50%" }, { y: -150, opacity: 0, scale: 1.6 }, i * 0.5, E.gas + 0.6, 1.5));
      loop("#h-flame", { scaleY: 0.85, transformOrigin: "50% 100%" }, { scaleY: 1.12 }, 0, E.gas, 0.25);

      // 80%: ramen beneden blauw
      tl.to("#h-gw1 .glass, #h-gw2 .glass", { attr: { fill: "#82c0cc" }, duration: 0.4 }, E.glas80);
      fadeOut("#h-a-gwin", E.glas80 + 0.1);
      tl.to("#h-wallred", { opacity: 0.85, duration: 0.4 }, E.glas80);
      // 70%: isolatie muren + vloer
      tl.fromTo("#h-insF", { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, E.vloer);
      fadeOut("#h-a-floor", E.vloer + 0.3);
      tl.fromTo("#h-insL, #h-insR", { opacity: 1, scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, E.spouw);
      fadeOut("#h-a-wallL, #h-a-wallR", E.spouw + 0.3);
      tl.to("#h-wallred", { opacity: 0.55, duration: 0.4 }, E.spouw);
      // 60%: dakdeken + wolk poef
      tl.fromTo("#h-blanket", { opacity: 1, scale: 0, transformOrigin: "50% 0%" }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, E.dak);
      tl.to("#h-roofred", { opacity: 0, duration: 0.4 }, E.dak + 0.2);
      tl.to("#h-cloud", { scale: 1.35, opacity: 0, duration: 0.35, ease: "power2.out", transformOrigin: "50% 50%" }, E.weg);
      tl.to("#h-wallred", { opacity: 0.35, duration: 0.4 }, E.weg);
      // 50%: alle ramen HR++ + glimmen
      tl.to("#h-uw1 .glass, #h-uw2 .glass", { attr: { fill: "#82c0cc" }, duration: 0.4 }, E.hr);
      fadeOut("#h-a-uwin", E.hr + 0.1);
      tl.to("#h-wallred", { opacity: 0.12, duration: 0.6 }, E.hr);
      $$("#h-glint path").forEach((p, i) => tl.fromTo(p, { scale: 0, rotation: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 90, duration: 0.35, yoyo: true, repeat: 3, ease: "power2.out" }, E.hr + 0.3 + i * 0.12));
      tl.set("#h-glint", { opacity: 1 }, E.hr + 0.3);
      // 40%: zon op, panelen, stroom
      tl.fromTo("#h-sun", { opacity: 0, y: 320 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, E.zon - 0.3);
      tl.fromTo("#h-panels", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, E.zon);
      tl.to("#h-wallred", { opacity: 0, duration: 0.4 }, E.zon);
      fadeIn("#h-power", E.stroom);
      cycle("#h-power", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -64 } }, E.stroom, END, 0.5);
      // 30%: warmtepomp aan, gas uit
      tl.fromTo("#h-unit", { opacity: 0, x: -220 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, E.wp);
      cycle("#h-fan", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 360 }, E.wp, END, 0.6);
      tl.to("#h-flame", { opacity: 0, scale: 0, duration: 0.3, transformOrigin: "50% 100%" }, E.gas);
      fadeOut("#h-smoke", E.gas + 0.2);
      // 20%: batterij, avond, licht blijft aan, batterij loopt leeg
      tl.fromTo("#h-batt", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, E.batt);
      tl.to("#h-night", { opacity: 0.78, duration: 0.8 }, E.avond);
      tl.to("#h-stars", { opacity: 1, duration: 0.8 }, E.avond + 0.3);
      tl.to("#h-sun", { y: 340, opacity: 0, duration: 0.9, ease: "power2.in" }, E.avond);
      tl.to("#house .glass", { attr: { fill: "#ffe082" }, duration: 0.4 }, E.avond + 0.4);
      const span = P["20"] - (E.avond + 0.8);
      [3, 2, 1].forEach((b, k) => tl.to("#h-bar" + b, { opacity: 0.15, duration: 0.25 }, E.avond + 0.8 + span * (k + 1) / 4));
      // 10%: weer dag, EMS, lijntjes, groen
      const d10 = H["10"];
      tl.set("#h-night, #h-stars", { opacity: 0 }, d10); tl.set("#h-sun", { y: 0, opacity: 1 }, d10);
      tl.set("#house svg .glass", { attr: { fill: "#82c0cc" } }, d10);
      tl.set("#h-bar1, #h-bar2, #h-bar3", { opacity: 1 }, d10);
      tl.fromTo("#h-ems", { opacity: 1, scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, E.ems);
      fadeIn("#h-emslines", E.lijnen, 0.3);
      $$("#h-emslines .eline").forEach((p, i) => cycle(p, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": i % 2 ? 64 : -64 } }, E.lijnen, END, 0.45));
      loop("#h-ems", { scale: 1 }, { scale: 1.08 }, E.lijnen, P["10"], 0.3);
      tl.to("#h-wallgreen", { opacity: 0.4, duration: 0.5 }, E.groen);
      tl.to("#h-roofgreen", { opacity: 0.45, duration: 0.5 }, E.groen);
      tl.to("#h-glow", { opacity: 1, duration: 0.5 }, E.groen);

      // ---------- Afsluiter: rood vs groen ----------
      tl.set("#outro", { opacity: 1 }, C.outro);
      tl.fromTo("#oh1", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, C.outro);
      tl.fromTo("#oarrow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, C.outro + 0.35);
      tl.fromTo("#oh2", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, C.outro + 0.6);
      $$("#r-smoke .puff").forEach((p, i) => cycle(p, { y: 0, opacity: 0.85, scale: 0.6, transformOrigin: "50% 50%" }, { y: -150, opacity: 0, scale: 1.6 }, C.outro + i * 0.5, END, 1.5));

      // ---------- CTA ----------
      $("#cta").innerHTML = 'Volg <span class="hl2">@sardobouw</span>';
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.8)" }, C.ctaStart);

      tl.set({}, {}, END);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
