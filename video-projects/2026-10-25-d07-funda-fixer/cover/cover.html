<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand-tokens.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#19191e;font-family:Poppins,sans-serif;position:relative}
#face{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;transform:translateY(-150px) scale(1.04);transform-origin:540px 534px}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,25,30,0) 30%,rgba(25,25,30,.7) 46%,rgba(25,25,30,.97) 60%)}
#txt{position:absolute;left:0;right:0;top:820px;text-align:center}
.badge{display:inline-block;background:#ffa62b;color:#19191e;font-size:46px;font-weight:800;letter-spacing:.06em;padding:12px 34px;border-radius:18px;text-transform:uppercase}
.l1{margin-top:26px;font-size:180px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.02em;-webkit-text-stroke:5px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.l1 .o{color:#ffa62b}.l1 .arr{color:#82c0cc;font-size:150px}
.card{position:relative;margin:44px auto 0;width:860px;height:430px;border-radius:30px;overflow:hidden;border:4px solid #ffa62b}
.card img{width:100%;height:100%;object-fit:cover}
.card .tag{position:absolute;left:22px;bottom:22px;background:rgba(25,25,30,.9);color:#fff;font-size:42px;font-weight:700;padding:12px 26px;border-radius:16px}
.card .win{position:absolute;right:22px;top:22px;background:#ffa62b;color:#19191e;font-size:46px;font-weight:800;padding:10px 24px;border-radius:16px}
</style></head><body>
<img id="face" src="face.jpg"><div id="shade"></div>
<div id="txt"><div class="badge">Funda Fixer #1</div>
<div class="l1">Label <span class="o">F</span> <span class="arr">➜</span> <span class="o">A</span></div>
<div class="card"><img src="huis.png"><div class="win">€325/mnd minder</div><div class="tag">Hoekhuis · jaren 30 · Arnhem</div></div>
</div></body></html>
